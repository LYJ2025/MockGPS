org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# 关掉「非传递 R 类」。
# 原因：本工程的主题系统大量使用 Material 的角色属性（?attr/colorPrimary 等），
# Java 侧也要用 R.attr.colorPrimary / R.attr.colorOnSurface 去取值。
# AGP 8 默认开启 nonTransitiveRClass 时，Material 的属性不会进本工程的 R 类，
# 这些引用会全部编译失败。
# 另外：这里原来是 android.nonTransitiveRfc（拼写错误，等于没配），一并改正。
android.nonTransitiveRClass=false
